<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Xác nhận xóa tin đăng')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>

<main class="page-container page-content">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="bl-form-card text-center">

                <!-- Warning icon -->
                <div class="mb-4">
                    <div style="width:72px;height:72px;background:#FEE2E2;border-radius:var(--radius-full);
                                display:inline-flex;align-items:center;justify-content:center;font-size:2rem;">
                        <i class="fa-solid fa-trash text-danger"></i>
                    </div>
                </div>

                <h2 style="font-size:1.25rem; font-weight:700; color:var(--color-gray-900); margin-bottom:0.75rem;">
                    Xác nhận xóa tin đăng này?
                </h2>

                <p class="text-muted" style="font-size:0.9rem;">
                    Bạn sắp xóa vĩnh viễn tin đăng bán sau đây khỏi BookLoop.
                    Hành động này <strong>không thể hoàn tác</strong>.
                </p>

                <!-- Listing preview -->
                <div class="bl-form-card mt-4 mb-4 text-start"
                     style="background:var(--color-gray-50); border: 1px solid var(--color-gray-200);">
                    <div class="d-flex gap-3 align-items-center">
                        <div style="width:60px; height:80px; border-radius:var(--radius-sm);
                                    background:#f8fafc; border: 1px solid var(--color-gray-200);
                                    display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; padding:2px;">
                            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                                 th:src="${product.imageUrl}" th:alt="${product.title}"
                                 loading="lazy"
                                 style="max-width:100%; max-height:100%; object-fit:contain;"
                                 onerror="this.onerror=null; this.src='/images/book-placeholder.svg';"/>
                            <span th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"
                                  class="text-muted"><i class="fa-solid fa-book-open"></i></span>
                        </div>
                        <div>
                            <div style="font-weight:700; font-size:0.9rem; color:var(--color-gray-900);"
                                 th:text="${product.title}">Tiêu đề</div>
                            <div style="font-size:0.8rem; color:var(--color-gray-500);"
                                 th:text="${product.condition.displayName}">Tình trạng</div>
                            <div class="fw-bold text-primary"
                                 th:text="${@formatUtils.formatVnd(product.price)}">0 ₫</div>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="d-flex gap-3 justify-content-center">
                    <form th:action="@{/my-listings/{id}/delete(id=${product.id})}" method="post"
                          class="delete-form">
                        <button type="submit"
                                class="btn btn-danger rounded-pill px-4 py-2 fw-semibold">
                            <i class="fa-solid fa-trash me-2"></i>Xác nhận xóa
                        </button>
                    </form>
                    <a th:href="@{/my-listings}"
                       class="btn-outline-bl" style="padding:0.6rem 2rem;">
                        Hủy bỏ
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
