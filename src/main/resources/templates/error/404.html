<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Không tìm thấy trang')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>
<main class="page-container page-content">
    <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3 th:text="${errorTitle != null} ? ${errorTitle} : 'Không tìm thấy trang yêu cầu (404)'">404 Không tìm thấy</h3>
        <p class="text-muted"
           th:text="${errorMessage != null} ? ${errorMessage} : 'Trang hoặc tài nguyên bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển.'"></p>
        <a th:href="@{/}" class="btn-primary-bl mt-3">
            <i class="fa-solid fa-house me-1"></i>Về trang chủ
        </a>
    </div>
</main>
<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
