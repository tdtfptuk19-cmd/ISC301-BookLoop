<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: adminHead('Quản lý đơn hàng')}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/layout :: sidebar('orders')}"></div>
    <main class="admin-main">
        <div class="admin-topbar">
            <div class="page-heading"><i class="fa-solid fa-receipt me-2 text-success"></i>Quản lý &amp; Giám sát đơn hàng</div>
            <span class="admin-badge">Admin Panel</span>
        </div>
        <div class="admin-content">

            <!-- Search / Filter -->
            <div class="admin-card mb-4 shadow-sm">
                <div class="card-header fw-bold">Tìm kiếm &amp; Lọc đơn hàng</div>
                <div class="p-3">
                    <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">Từ khóa (Mã đơn hoặc tên người mua)</label>
                            <input type="text" name="keyword" th:value="${keyword}"
                                   class="form-control form-control-sm" placeholder="Tìm theo mã đơn hoặc người mua..."/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Trạng thái</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">Tất cả trạng thái</option>
                                <option th:each="s : ${statuses}" th:value="${s.name()}"
                                        th:text="${s.displayName}"
                                        th:selected="${selectedStatus == s.name()}"></option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                <i class="fa-solid fa-magnifying-glass me-1"></i>Tìm
                            </button>
                            <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm">Xóa lọc</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Tất cả đơn hàng giao dịch</span>
                    <div>
                        <span class="badge bg-primary" th:text="${orders.totalElements} + ' đơn'"></span>
                        <small class="text-muted ms-2">(Quyền xem - trạng thái do người mua &amp; bán xác nhận)</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Mã đơn</th>
                                <th>Người mua</th>
                                <th>Tổng tiền</th>
                                <th>Phương thức</th>
                                <th>Trạng thái</th>
                                <th>Ngày đặt</th>
                                <th class="text-end pe-3">Chi tiết</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${orders.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">Không tìm thấy đơn hàng nào.</td>
                            </tr>
                            <tr th:each="o : ${orders}">
                                <td class="ps-3 font-monospace small fw-bold text-dark" th:text="${o.orderNumber}"></td>
                                <td class="small" th:text="${o.buyer.fullName}"></td>
                                <td class="small fw-bold text-primary" th:text="${@formatUtils.formatVnd(o.totalAmount)}">0 ₫</td>
                                <td class="small" th:text="${o.paymentMethod.displayName}"></td>
                                <td>
                                    <span th:text="${o.status.displayName}"
                                          th:classappend="${o.status.name() == 'COMPLETED'} ? 'badge bg-success' : (${o.status.name() == 'PENDING'} ? 'badge bg-warning text-dark' : (${o.status.name() == 'CANCELLED'} ? 'badge bg-danger' : 'badge bg-info'))"
                                          class="badge-status"></span>
                                </td>
                                <td class="text-muted small"
                                    th:text="${@formatUtils.formatDate(o.orderDate)}"></td>
                                <td class="text-end pe-3">
                                    <a th:href="@{/admin/orders/{id}(id=${o.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="p-3 d-flex justify-content-between align-items-center border-top" th:if="${orders.totalPages > 1}">
                    <small class="text-muted">
                        Trang <span th:text="${orders.number + 1}"></span> trên <span th:text="${orders.totalPages}"></span>
                    </small>
                    <div class="btn-group btn-group-sm">
                        <a th:href="@{/admin/orders(page=${orders.number - 1}, keyword=${keyword}, status=${selectedStatus})}"
                           th:classappend="${!orders.hasPreviousPage()} ? 'disabled' : ''"
                           class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-left"></i></a>
                        <a th:href="@{/admin/orders(page=${orders.number + 1}, keyword=${keyword}, status=${selectedStatus})}"
                           th:classappend="${!orders.hasNextPage()} ? 'disabled' : ''"
                           class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{admin/layout :: adminScripts}"></div>
</body>
</html>
