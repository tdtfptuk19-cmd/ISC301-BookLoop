<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: adminHead('Activity Logs')}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/layout :: sidebar('logs')}"></div>
    <main class="admin-main">
        <div class="admin-topbar">
            <div class="page-heading"><i class="fa-solid fa-clock-rotate-left me-2 text-secondary"></i>Admin Activity Log</div>
            <span class="admin-badge">Audit Trail</span>
        </div>
        <div class="admin-content">

            <div class="admin-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Audit Trail
                        <span class="badge bg-secondary ms-1" th:text="${logs.totalElements}"></span>
                    </span>
                    <small class="text-muted">Immutable platform action history</small>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="ps-3">Timestamp</th>
                                <th>Admin User</th>
                                <th>Action</th>
                                <th>Target Type</th>
                                <th>Target ID</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${logs.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">No audit logs recorded yet.</td>
                            </tr>
                            <tr th:each="l : ${logs}">
                                <td class="ps-3 text-muted small"
                                    th:text="${#temporals.format(l.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td class="small fw-600" th:text="${l.admin.fullName}"></td>
                                <td>
                                    <span class="badge bg-dark badge-status" th:text="${l.action}"></span>
                                </td>
                                <td class="small text-muted" th:text="${l.targetType ?: '—'}"></td>
                                <td class="small text-muted" th:text="${l.targetId ?: '—'}"></td>
                                <td class="small" th:text="${l.description}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="p-3 d-flex justify-content-between align-items-center border-top" th:if="${logs.totalPages > 1}">
                    <small class="text-muted">
                        Page <span th:text="${logs.number + 1}"></span> of <span th:text="${logs.totalPages}"></span>
                    </small>
                    <div class="btn-group btn-group-sm">
                        <a th:href="@{/admin/logs(page=${logs.number - 1})}"
                           th:classappend="${!logs.hasPreviousPage()} ? 'disabled' : ''"
                           class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-left"></i></a>
                        <a th:href="@{/admin/logs(page=${logs.number + 1})}"
                           th:classappend="${!logs.hasNextPage()} ? 'disabled' : ''"
                           class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{admin/layout :: adminScripts}"></div>
</body>
</html>
