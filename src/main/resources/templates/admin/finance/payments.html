<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: adminHead('Giao dịch thanh toán')}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/layout :: sidebar('finance-payments')}"></div>

    <main class="admin-main">
        <div class="admin-topbar">
            <div class="page-heading"><i class="fa-solid fa-credit-card me-2 text-primary"></i>Quản lý Giao dịch thanh toán</div>
            <span class="admin-badge">Admin Finance</span>
        </div>

        <div class="admin-content">
            <!-- Filter Bar -->
            <div class="stat-card mb-4">
                <form th:action="@{/admin/finance/payments}" method="get" class="row g-3 align-items-center">
                    <div class="col-sm-4">
                        <label class="form-label small fw-semibold">Lọc theo trạng thái</label>
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="st : ${statuses}" th:value="${st.name()}"
                                    th:text="${st.name()}"
                                    th:selected="${selectedStatus != null and selectedStatus.name() == st.name()}"></option>
                        </select>
                    </div>
                    <div class="col-sm-8 text-end pt-4">
                        <span class="text-muted small">Tổng số: <strong th:text="${payments.totalElements}">0</strong> giao dịch</span>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <div class="stat-card">
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="bg-light">
                            <tr class="small text-uppercase text-muted">
                                <th>Mã tham chiếu</th>
                                <th>Đơn hàng</th>
                                <th>Số tiền</th>
                                <th>Cổng / Đối tác</th>
                                <th>Trạng thái</th>
                                <th>Mã đối tác</th>
                                <th class="text-end">Thời gian tạo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${payments.empty}">
                                <td colspan="7" class="text-center py-4 text-muted">Không tìm thấy giao dịch nào.</td>
                            </tr>
                            <tr th:each="tx : ${payments.content}">
                                <td class="font-monospace fw-bold text-dark" th:text="${tx.merchantReference}">PAY-XXXX</td>
                                <td>
                                    <a th:if="${tx.order != null}" th:href="@{/orders/{id}(id=${tx.order.id})}"
                                       class="text-primary fw-semibold" th:text="${tx.order.orderNumber}">ORD-XXXX</a>
                                </td>
                                <td>
                                    <strong class="text-primary" th:text="${@formatUtils.formatVnd(tx.amount)}">0 ₫</strong>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${tx.providerCode}">MOCK_PROVIDER</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${tx.paymentStatus.name() == 'HELD' or tx.paymentStatus.name() == 'SETTLED'} ? 'bg-success' : (${tx.paymentStatus.name() == 'FAILED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                          th:text="${tx.paymentStatus.name()}">HELD</span>
                                </td>
                                <td class="small text-muted font-monospace" th:text="${tx.providerPaymentId != null ? tx.providerPaymentId : '—'}">mock_pay_123</td>
                                <td class="text-end small text-muted" th:text="${#temporals.format(tx.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${payments.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                    <span class="small text-muted" th:text="'Trang ' + (${payments.number} + 1) + ' / ' + ${payments.totalPages}"></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${payments.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/payments(page=${payments.number - 1}, status=${selectedStatus})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:classappend="${payments.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/payments(page=${payments.number + 1}, status=${selectedStatus})}">&raquo;</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{admin/layout :: adminScripts}"></th:block>
</body>
</html>
