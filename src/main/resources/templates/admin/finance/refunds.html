<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: adminHead('Hoàn tiền người mua')}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/layout :: sidebar('finance-refunds')}"></div>

    <main class="admin-main">
        <div class="admin-topbar">
            <div class="page-heading"><i class="fa-solid fa-rotate-left me-2 text-danger"></i>Giao dịch Hoàn tiền người mua (Refunds)</div>
            <span class="admin-badge">Admin Finance</span>
        </div>

        <div class="admin-content">
            <!-- Filter Bar -->
            <div class="stat-card mb-4">
                <form th:action="@{/admin/finance/refunds}" method="get" class="row g-3 align-items-center">
                    <div class="col-sm-4">
                        <label class="form-label small fw-semibold">Lọc theo trạng thái hoàn tiền</label>
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="st : ${statuses}" th:value="${st.name()}"
                                    th:text="${st.name()}"
                                    th:selected="${selectedStatus != null and selectedStatus.name() == st.name()}"></option>
                        </select>
                    </div>
                    <div class="col-sm-8 text-end pt-4">
                        <span class="text-muted small">Tổng số: <strong th:text="${refunds.totalElements}">0</strong> giao dịch</span>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <div class="stat-card">
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="bg-light">
                            <tr class="small text-uppercase text-muted">
                                <th>Mã lệnh (Idempotency)</th>
                                <th>Đơn hàng</th>
                                <th>Số tiền hoàn</th>
                                <th>Loại hoàn</th>
                                <th>Lý do</th>
                                <th>Trạng thái</th>
                                <th>Mã đối tác</th>
                                <th class="text-end">Thời gian</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${refunds.empty}">
                                <td colspan="8" class="text-center py-4 text-muted">Không có giao dịch hoàn tiền nào.</td>
                            </tr>
                            <tr th:each="r : ${refunds.content}">
                                <td class="font-monospace fw-bold text-dark small" th:text="${r.idempotencyKey}">REF-XXXX</td>
                                <td>
                                    <a th:if="${r.order != null}" th:href="@{/orders/{id}(id=${r.order.id})}"
                                       class="text-primary fw-semibold" th:text="${r.order.orderNumber}">ORD-XXXX</a>
                                </td>
                                <td>
                                    <strong class="text-danger" th:text="${@formatUtils.formatVnd(r.refundAmount)}">0 ₫</strong>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${r.refundType}">FULL</span>
                                </td>
                                <td class="small text-muted" th:text="${r.reason}">Lý do</td>
                                <td>
                                    <span class="badge" th:classappend="${r.status.name() == 'REFUNDED' or r.status.name() == 'CONFIRMED'} ? 'bg-success' : 'bg-warning text-dark'"
                                          th:text="${r.status.name()}">REFUNDED</span>
                                </td>
                                <td class="small text-muted font-monospace" th:text="${r.providerRefundId != null ? r.providerRefundId : '—'}">mock_ref</td>
                                <td class="text-end small text-muted" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${refunds.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                    <span class="small text-muted" th:text="'Trang ' + (${refunds.number} + 1) + ' / ' + ${refunds.totalPages}"></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${refunds.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/refunds(page=${refunds.number - 1}, status=${selectedStatus})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:classappend="${refunds.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/refunds(page=${refunds.number + 1}, status=${selectedStatus})}">&raquo;</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{admin/layout :: adminScripts}"></th:block>
</body>
</html>
