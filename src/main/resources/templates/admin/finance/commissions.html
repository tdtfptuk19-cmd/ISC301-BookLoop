<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: adminHead('Thu phí hoa hồng')}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/layout :: sidebar('finance-commissions')}"></div>

    <main class="admin-main">
        <div class="admin-topbar">
            <div class="page-heading"><i class="fa-solid fa-percent me-2 text-primary"></i>Quản lý Thu phí hoa hồng nền tảng</div>
            <span class="admin-badge">Admin Finance</span>
        </div>

        <div class="admin-content">
            <!-- Filter Bar -->
            <div class="stat-card mb-4">
                <form th:action="@{/admin/finance/commissions}" method="get" class="row g-3 align-items-center">
                    <div class="col-sm-4">
                        <label class="form-label small fw-semibold">Lọc theo trạng thái hoa hồng</label>
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option th:each="st : ${statuses}" th:value="${st.name()}"
                                    th:text="${st.displayName}"
                                    th:selected="${selectedStatus != null and selectedStatus.name() == st.name()}"></option>
                        </select>
                    </div>
                    <div class="col-sm-8 text-end pt-4">
                        <span class="text-muted small">Tổng số: <strong th:text="${commissions.totalElements}">0</strong> bản ghi</span>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <div class="stat-card">
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="bg-light">
                            <tr class="small text-uppercase text-muted">
                                <th>Đơn hàng</th>
                                <th>Người bán</th>
                                <th>Tổng tiền đơn</th>
                                <th>Tỷ lệ %</th>
                                <th>Hoa hồng BookLoop</th>
                                <th>Thực nhận người bán</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Thời gian ghi nhận</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${commissions.empty}">
                                <td colspan="8" class="text-center py-4 text-muted">Không có bản ghi hoa hồng nào.</td>
                            </tr>
                            <tr th:each="c : ${commissions.content}">
                                <td>
                                    <a th:if="${c.order != null}" th:href="@{/orders/{id}(id=${c.order.id})}"
                                       class="text-primary fw-semibold" th:text="${c.order.orderNumber}">ORD-XXXX</a>
                                </td>
                                <td class="small" th:text="${c.seller != null ? c.seller.fullName : '—'}">Người bán</td>
                                <td class="fw-semibold text-dark" th:text="${@formatUtils.formatVnd(c.orderGrossAmount)}">0 ₫</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${c.ratePercentageApplied} + '%'">5.0%</span>
                                </td>
                                <td>
                                    <strong class="text-primary" th:text="${@formatUtils.formatVnd(c.commissionAmount)}">0 ₫</strong>
                                </td>
                                <td>
                                    <span class="text-success fw-semibold" th:text="${@formatUtils.formatVnd(c.sellerNetAmount)}">0 ₫</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${c.status.name() == 'SETTLED'} ? 'bg-success' : (${c.status.name() == 'REVERSED'} ? 'bg-danger' : 'bg-secondary')"
                                          th:text="${c.status.displayName}">SETTLED</span>
                                </td>
                                <td class="text-end small text-muted" th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${commissions.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                    <span class="small text-muted" th:text="'Trang ' + (${commissions.number} + 1) + ' / ' + ${commissions.totalPages}"></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${commissions.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/commissions(page=${commissions.number - 1}, status=${selectedStatus})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:classappend="${commissions.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/finance/commissions(page=${commissions.number + 1}, status=${selectedStatus})}">&raquo;</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{admin/layout :: adminScripts}"></th:block>
</body>
</html>
