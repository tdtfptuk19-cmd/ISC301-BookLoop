<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Có lỗi xảy ra')}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar}"></nav>
<main class="page-container page-content">
    <div class="empty-state">
        <div class="empty-icon">😵</div>
        <h3>Đã xảy ra sự cố không mong muốn</h3>
        <p class="text-muted" th:if="${message}" th:text="${message}"></p>
        <p class="text-muted" th:unless="${message}">Hệ thống gặp sự cố xử lý yêu cầu của bạn. Vui lòng thử lại sau ít phút.</p>
        <a th:href="@{/}" class="btn-primary-bl mt-3">
            <i class="fa-solid fa-house me-1"></i>Về trang chủ
        </a>
    </div>
</main>
<footer th:replace="~{layout/layout :: footer}"></footer>
<th:block th:replace="~{layout/layout :: scripts}"></th:block>
</body>
</html>
