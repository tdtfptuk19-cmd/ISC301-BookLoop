<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="300" height="400" rx="12" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Book Spine Visual Hint -->
  <line x1="28" y1="20" x2="28" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Center Book Illustration -->
  <g transform="translate(150, 175)" filter="url(#shadow)">
    <!-- Book Cover Base -->
    <rect x="-65" y="-85" width="130" height="170" rx="8" fill="url(#bookGrad)" />
    <!-- Book Spine -->
    <rect x="-65" y="-85" width="16" height="170" rx="4" fill="#3730a3" />
    <!-- Book Page Lines -->
    <rect x="-35" y="-60" width="85" height="12" rx="3" fill="#ffffff" opacity="0.85" />
    <rect x="-35" y="-40" width="65" height="8" rx="2" fill="#ffffff" opacity="0.6" />
    <rect x="-35" y="-24" width="75" height="8" rx="2" fill="#ffffff" opacity="0.6" />
    
    <!-- Open Book / Graduation Cap Icon Symbol -->
    <path d="M-15,15 L15,15 M-10,30 L10,30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <polygon points="0,5 -30,22 0,38 30,22" fill="#ffffff" opacity="0.9" />
    <path d="M-22,27 L-22,50 Q0,62 22,50 L22,27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
  </g>

  <!-- Typography Label -->
  <text x="150" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.5">
    BookLoop
  </text>
  <text x="150" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    Giáo trình &amp; Sách sinh viên
  </text>
  <text x="150" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Đang cập nhật hình ảnh bìa
  </text>
</svg>

